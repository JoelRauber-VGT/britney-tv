# Feed-Quellen der News-Pipeline.
# kind: ai | energy  ·  weight: multipliziert den LLM-Score beim Ranking
sources:
  - name: The Decoder
    url: https://the-decoder.de/feed/
    kind: ai
    weight: 1.2
  - name: pv magazine
    url: https://www.pv-magazine.de/feed/
    kind: energy
    weight: 1.0
  - name: Clean Energy Wire
    url: https://www.cleanenergywire.org/rss.xml
    kind: energy
    weight: 1.0
  - name: heise
    url: https://www.heise.de/thema/Kuenstliche-Intelligenz.xml
    kind: ai
    weight: 1.1
  - name: SRF
    url: https://www.srf.ch/news/bnf/rss/1890        # Schweiz (Inland)
    kind: general
    weight: 1.2
  - name: SRF Wirtschaft
    url: https://www.srf.ch/news/bnf/rss/1926
    kind: general
    weight: 1.2
  - name: tagesschau
    url: https://www.tagesschau.de/wirtschaft/energie/index~rss2.xml
    kind: energy
    weight: 1.0
  # US-Quelle: nur noch, wenn es weltweit Gewicht hat (Prompt bewertet US-Lokalthemen tief)
  - name: Utility Dive
    url: https://www.utilitydive.com/feeds/news/
    kind: energy
    weight: 0.7
  # Geprüft, liefert 404:
  # - name: Clean Energy Wire (News)
  #   url: https://www.cleanenergywire.org/news/feed
  #   kind: energy
  #   weight: 1.0

# Auswahl pro Lauf
selection:
  total: 14          # Anzahl Karten im Kiosk (12–15)
  max_age_hours: 72  # nur Artikel der letzten 72 h
  min_score: 40      # darunter fliegt ein Artikel raus
  mix:               # Ziel-Mix; zu wenig in einer Kategorie → auffüllen
    "KI weltweit": 0.55
    "KI × Energie": 0.25
    "Energie": 0.20
