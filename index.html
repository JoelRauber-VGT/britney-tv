<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Britney · Forschungsprojekt</title>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Galaxie-Hintergrund, rein CSS/GPU:
       1) .nebula — drei weiche Nebelschleier (Blau / Rot / Blauviolett)
       2) .galaxy — das Band der Milchstraße mit dunkler Staubbahn, rotem
          Emissions- und blauem Reflexionsnebel, diagonal über die Szene
       3) .stars  — drei Sternenfeld-Ebenen (fern/mittel/nah) aus gekachelten
          Radial-Gradients: EIN Element pro Ebene, ein Paint, Pi-tauglich.
       Über config.js (background: 'aurora' | 'static' | 'off') umschaltbar. -->
  <div class="nebula" aria-hidden="true">
    <span class="aurora__blob aurora__blob--1"></span>
    <span class="aurora__blob aurora__blob--2"></span>
    <span class="aurora__blob aurora__blob--3"></span>
  </div>
  <div class="galaxy" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true">
    <span class="stars__layer stars__layer--far"></span>
    <span class="stars__layer stars__layer--mid"></span>
    <span class="stars__layer stars__layer--near"></span>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Grabstein-Modus (config: grave.show). Füllt den ganzen Schirm,
       alles andere wird dann ausgeblendet. Texte kommen aus config.js. -->
  <section class="grave" id="grave" hidden aria-label="Grabstein">
    <div class="grave__moon" aria-hidden="true"></div>
    <div class="grave__bats" aria-hidden="true">
      <svg class="grave__bat" viewBox="0 0 100 44"><path d="M50 14c-3-6-5-6-6-2-4-2-9 0-11 6C27 8 14 4 0 8c8 4 12 12 12 22 6-6 12-6 16 0 4-6 10-6 14 2 2-4 5-6 8-6s6 2 8 6c4-8 10-8 14-2 4-6 10-6 16 0 0-10 4-18 12-22-14-4-27 0-33 10-2-6-7-8-11-6-1-4-3-4-6 2z" fill="oklch(12% 0.02 280)"/></svg>
      <svg class="grave__bat" viewBox="0 0 100 44"><path d="M50 14c-3-6-5-6-6-2-4-2-9 0-11 6C27 8 14 4 0 8c8 4 12 12 12 22 6-6 12-6 16 0 4-6 10-6 14 2 2-4 5-6 8-6s6 2 8 6c4-8 10-8 14-2 4-6 10-6 16 0 0-10 4-18 12-22-14-4-27 0-33 10-2-6-7-8-11-6-1-4-3-4-6 2z" fill="oklch(12% 0.02 280)"/></svg>
      <svg class="grave__bat" viewBox="0 0 100 44"><path d="M50 14c-3-6-5-6-6-2-4-2-9 0-11 6C27 8 14 4 0 8c8 4 12 12 12 22 6-6 12-6 16 0 4-6 10-6 14 2 2-4 5-6 8-6s6 2 8 6c4-8 10-8 14-2 4-6 10-6 16 0 0-10 4-18 12-22-14-4-27 0-33 10-2-6-7-8-11-6-1-4-3-4-6 2z" fill="oklch(12% 0.02 280)"/></svg>
    </div>
    <svg class="grave__ghost" id="graveGhost" viewBox="0 0 120 150" aria-hidden="true">
      <path d="M60 6C29 6 12 30 12 62v76l12-10 12 12 12-12 12 12 12-12 12 12 12-12 12 10V62C108 30 91 6 60 6z"
            fill="oklch(95% 0.02 270 / 0.88)"/>
      <ellipse cx="44" cy="58" rx="7" ry="10" fill="oklch(20% 0.03 270)"/>
      <ellipse cx="76" cy="58" rx="7" ry="10" fill="oklch(20% 0.03 270)"/>
      <ellipse cx="60" cy="86" rx="9" ry="7" fill="oklch(20% 0.03 270)"/>
    </svg>

    <div class="grave__stone">
      <svg class="grave__crack" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="90,9 87,17 91,23 85,31 88,37 84,44" fill="none"
                  stroke="oklch(22% 0.02 280 / 0.55)" stroke-width="0.6" vector-effect="non-scaling-stroke"/>
      </svg>
      <svg class="grave__web" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="oklch(92% 0.01 280 / 0.55)" stroke-width="0.8">
          <path d="M0 0L100 30M0 0L80 70M0 0L45 100M0 0L10 100"/>
          <path d="M0 20Q9 15 20 6M0 38Q18 30 36 11M0 58Q27 46 54 17M0 78Q37 62 72 22"/>
          <path d="M20 6Q22 18 16 28 6 34 4 40M36 11Q40 30 31 48 16 62 8 72M54 17Q58 42 46 68 28 84 14 94"/>
        </g>
      </svg>
      <div class="grave__spider" id="graveSpider" aria-hidden="true">
        <span class="grave__spider-thread"></span>
        <svg viewBox="0 0 60 50"><g stroke="oklch(12% 0.02 280)" stroke-width="2.5" fill="none" stroke-linecap="round">
          <path d="M22 22 6 10M22 26 2 24M22 30 6 40M24 33 12 48M38 22 54 10M38 26 58 24M38 30 54 40M36 33 48 48"/></g>
          <ellipse cx="30" cy="28" rx="11" ry="13" fill="oklch(12% 0.02 280)"/>
          <circle cx="30" cy="13" r="7" fill="oklch(12% 0.02 280)"/>
          <circle cx="27" cy="12" r="1.6" fill="oklch(70% 0.2 25)"/><circle cx="33" cy="12" r="1.6" fill="oklch(70% 0.2 25)"/>
        </svg>
      </div>
      <span class="grave__moss grave__moss--l" aria-hidden="true"></span>
      <span class="grave__moss grave__moss--r" aria-hidden="true"></span>

      <p class="grave__kicker" id="graveKicker"></p>
      <h1 class="grave__name" id="graveName"></h1>
      <p class="grave__sub" id="graveSub"></p>
      <p class="grave__dates" id="graveDates"></p>
      <svg class="grave__orn" viewBox="0 0 200 20" aria-hidden="true">
        <path d="M0 10h80M120 10h80" stroke="currentColor" stroke-width="1.5"/>
        <path d="M100 1v18M92 7h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <p class="grave__epitaph" id="graveEpitaph"></p>
      <p class="grave__note" id="graveNote"></p>
      <p class="grave__rip">R.I.P.</p>
    </div>
    <div class="grave__plinth" aria-hidden="true"></div>

    <div class="grave__ground" aria-hidden="true">
      <svg class="grave__pumpkin grave__pumpkin--big" viewBox="0 0 120 104">
        <path d="M58 18c0-8 4-14 10-16l4 4c-5 2-7 6-7 12z" fill="oklch(45% 0.09 130)"/>
        <ellipse cx="34" cy="62" rx="28" ry="38" fill="oklch(58% 0.17 50)"/>
        <ellipse cx="86" cy="62" rx="28" ry="38" fill="oklch(58% 0.17 50)"/>
        <ellipse cx="60" cy="62" rx="30" ry="41" fill="oklch(66% 0.18 55)"/>
        <g class="grave__pumpkin-face" fill="oklch(90% 0.16 90)">
          <path d="M34 50l12-14 10 14z"/><path d="M64 50l10-14 12 14z"/>
          <path d="M54 62l6-9 6 9z"/>
          <path d="M28 72c10 14 54 14 64 0l-8 3-4 7-6-6-8 7-8-7-6 6-4-7z"/>
        </g>
      </svg>
      <div class="grave__candle grave__candle--l"><span class="grave__flame"></span></div>
      <svg class="grave__flower grave__flower--up" viewBox="0 0 60 120">
        <path d="M30 120V48" stroke="oklch(48% 0.12 145)" stroke-width="4"/>
        <path d="M30 86c-12-4-18-14-18-22 10 2 16 10 18 22z" fill="oklch(52% 0.13 145)"/>
        <g fill="oklch(72% 0.17 15)">
          <circle cx="30" cy="22" r="11"/><circle cx="16" cy="34" r="11"/><circle cx="44" cy="34" r="11"/>
          <circle cx="21" cy="50" r="11"/><circle cx="39" cy="50" r="11"/>
        </g>
        <circle cx="30" cy="37" r="8" fill="oklch(86% 0.15 90)"/>
      </svg>
      <svg class="grave__flower grave__flower--wilted" viewBox="0 0 90 120">
        <path d="M20 120V70c0-30 30-46 52-34" fill="none" stroke="oklch(45% 0.08 120)" stroke-width="4"/>
        <g fill="oklch(55% 0.10 40)">
          <ellipse cx="74" cy="50" rx="7" ry="11"/><ellipse cx="64" cy="54" rx="6" ry="10" transform="rotate(25 64 54)"/>
          <ellipse cx="84" cy="54" rx="6" ry="10" transform="rotate(-25 84 54)"/>
        </g>
        <circle cx="74" cy="42" r="6" fill="oklch(62% 0.10 75)"/>
      </svg>
      <div class="grave__candle grave__candle--r"><span class="grave__flame"></span></div>
      <svg class="grave__pumpkin grave__pumpkin--small" viewBox="0 0 120 104">
        <path d="M58 18c0-8 4-14 10-16l4 4c-5 2-7 6-7 12z" fill="oklch(45% 0.09 130)"/>
        <ellipse cx="34" cy="62" rx="28" ry="38" fill="oklch(58% 0.17 50)"/>
        <ellipse cx="86" cy="62" rx="28" ry="38" fill="oklch(58% 0.17 50)"/>
        <ellipse cx="60" cy="62" rx="30" ry="41" fill="oklch(66% 0.18 55)"/>
        <g class="grave__pumpkin-face" fill="oklch(90% 0.16 90)">
          <path d="M34 50l12-14 10 14z"/><path d="M64 50l10-14 12 14z"/>
          <path d="M54 62l6-9 6 9z"/>
          <path d="M28 72c10 14 54 14 64 0l-8 3-4 7-6-6-8 7-8-7-6 6-4-7z"/>
        </g>
      </svg>
      <div class="grave__fog" aria-hidden="true"></div>
    </div>

    <p class="grave__footer" id="graveFooter"></p>
  </section>

  <!-- Mitte: News-Widget (Standard) ODER Britney-Video — umschaltbar über
       config.js (center: 'news' | 'video'). Das jeweils andere wird entfernt. -->
  <section class="news" id="news" aria-label="KI- und Energie-News" aria-live="off">
    <article class="news__card" data-layer="a">
      <div class="news__media"><img class="news__img" alt="" decoding="async"></div>
      <div class="news__body">
        <div class="news__meta">
          <span class="news__pill"></span>
          <span class="news__badge">Neu</span>
          <span class="news__pos"></span>
        </div>
        <h2 class="news__title"></h2>
        <p class="news__summary"></p>
        <div class="news__foot">
          <p class="news__src"><span class="news__source"></span><span class="news__time"></span></p>
          <figure class="news__qr"><img alt="" decoding="async"><figcaption>Artikel lesen</figcaption></figure>
        </div>
      </div>
    </article>
    <div class="news__progress" aria-hidden="true"><div class="news__progress-fill"></div></div>
  </section>

  <div class="britney" id="britney" aria-hidden="true">
    <video class="britney__vid is-front" id="vidA" muted playsinline loop preload="none"></video>
  </div>

  <!-- Oben: Countdown als „Tage als Held"-Stat-Block (spiegelt den IQ unten) -->
  <header class="hud hud--top reveal" style="--i: 0">
    <div class="countdown" role="timer" aria-label="Verbleibende Projektzeit">
      <p class="phase" id="phase"></p>
      <div class="countdown__figure" id="cd" aria-label="Verbleibende Tage">–</div>
      <p class="countdown__label">Tage bis Projektende</p>
      <div class="track" aria-hidden="true"><div class="track__fill" id="projFill"></div></div>
      <p class="meta__dates" id="dates"></p>
    </div>
  </header>

  <!-- Mitte: Forschungskooperation VGT × FHNW -->
  <main class="stage reveal" style="--i: 1">
    <div class="collab" aria-label="Forschungskooperation VGT und FHNW">
      <figure class="collab__logo collab__logo--vgt">
        <img src="./vgt.png" alt="VGT">
      </figure>
      <span class="collab__x" aria-hidden="true">×</span>
      <figure class="collab__logo collab__logo--fhnw">
        <img src="./fhnw.png" alt="FHNW – Fachhochschule Nordwestschweiz">
      </figure>
    </div>

    <p class="stage__caption" id="caption">Gemeinsames KI-Forschungsprojekt <strong>Britney</strong></p>
  </main>

  <!-- Unten: IQ-Stand -->
  <footer class="hud hud--bottom reveal" style="--i: 2">
    <div class="iq">
      <div class="iq__figure" id="iqValue" aria-label="Aktueller IQ">–</div>
      <div class="iq__meta">
        <p class="label">Aktueller IQ</p>
        <p class="iq__range">Start <span id="iqStart">–</span> · Ziel <span class="hl" id="iqTarget">–</span></p>
        <div class="track" aria-hidden="true">
          <div class="track__fill" id="iqFill"></div>
          <div class="track__dot" id="iqDot"></div>
        </div>
      </div>
    </div>
  </footer>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
  <script src="./news.js"></script>

</body>
</html>
